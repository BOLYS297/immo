# IMMO Digital — hôtes immodigital.tech, www.immodigital.tech, admin.immodigital.tech.
#
# Fichier ajouté au frontal nginx de GLOBUS (/etc/nginx/conf.d/immo.conf) par immo-edge-sync : testé avec « nginx -t »
# avant chaque rechargement, retiré automatiquement s'il est refusé. Règles pour ne JAMAIS gêner GLOBUS :
#   - autonome : aucun « include » des extraits GLOBUS (un changement chez GLOBUS ne doit pas casser ce fichier) ;
#   - pas de default_server, pas de « map » ni de zone partagée déjà définis par GLOBUS (préfixe immo_ partout) ;
#   - adresses des conteneurs résolues à chaque requête (variables + DNS Docker) : nginx démarre et GLOBUS reste en
#     ligne même si la pile immo est arrêtée (les hôtes immo répondent alors « maintenance »).
# Certificat Let's Encrypt « immodigital.tech » (3 noms) dans le volume partagé, renouvelé par le certbot de GLOBUS
# (webroot /var/www/acme) et pris en compte par le rechargement périodique de nginx.

server {
    listen 80;
    listen [::]:80;
    server_name immodigital.tech www.immodigital.tech admin.immodigital.tech;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.immodigital.tech;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/immodigital.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/immodigital.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:IMMO_TLS:5m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    return 301 https://immodigital.tech$request_uri;
}

# Site public (Next.js).
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name immodigital.tech;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/immodigital.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/immodigital.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:IMMO_TLS:5m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    set $immo_front http://immo-front:3000;

    client_max_body_size 25m;
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml application/manifest+json;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 120s;

    error_page 502 504 = @immo_maintenance;

    # Agent IMMO : réponse diffusée au fil de l'eau (pas de mise en tampon).
    location = /api/chat {
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_pass $immo_front;
    }

    location / {
        proxy_pass $immo_front;
    }

    location @immo_maintenance {
        default_type text/html;
        add_header Retry-After 60 always;
        return 503 '<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>IMMO Digital</title><body style="font-family:system-ui;display:grid;place-items:center;min-height:90vh;margin:0"><p>Site en maintenance, merci de r&eacute;essayer dans quelques instants.</p></body></html>';
    }
}

# Administration Laravel (CMS) et API lue par le site.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name admin.immodigital.tech;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/immodigital.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/immodigital.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:IMMO_TLS:5m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    set $immo_back http://immo-back:8080;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Médiathèque : jusqu'à 20 images de 5 Mo par envoi.
    client_max_body_size 110m;
    client_body_timeout 120s;
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 120s;

    error_page 502 504 = @immo_maintenance;

    location / {
        proxy_pass $immo_back;
    }

    location @immo_maintenance {
        default_type text/plain;
        add_header Retry-After 60 always;
        return 503 'Administration en maintenance, merci de reessayer dans quelques instants.';
    }
}
