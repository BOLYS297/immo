; IMMO Digital — réglages PHP de production (complètent php.ini-production).
expose_php = Off
memory_limit = 256M
max_execution_time = 60
; Médiathèque : 20 images de 5 Mo maximum par envoi (config/cms.php, limite propre à Laravel).
; Documents du portail client : 10 Mo maximum (config/portal.php).
upload_max_filesize = 11M
max_file_uploads = 20
post_max_size = 110M

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; Code immuable dans l'image : pas de vérification des dates de fichiers.
opcache.validate_timestamps = 0

session.cookie_secure = 1
date.timezone = UTC
