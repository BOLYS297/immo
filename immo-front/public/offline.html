<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#273480">
<title>Hors ligne — IMMO Digital</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
    background: radial-gradient(ellipse at 50% 0%, rgba(84,195,233,.22), transparent 60%), #273480;
    color: #F4F4F4; font-family: Gilroy, 'Outfit Variable', ui-sans-serif, system-ui, sans-serif; line-height: 1.6; }
  main { max-width: 32rem; text-align: center; }
  img { width: 88px; height: auto; }
  h1 { margin: 28px 0 8px; font-size: 2rem; letter-spacing: -.03em; line-height: 1.1; color: #fff; }
  p { margin: 0; color: #AEDDED; }
  .en { margin-top: 18px; font-size: .95rem; opacity: .85; }
  button { margin-top: 32px; border: 0; border-radius: 999px; padding: 14px 28px; font: inherit; font-weight: 600;
    background: #54C3E9; color: #273480; cursor: pointer; }
  button:hover { background: #AEDDED; }
  button:focus-visible { outline: 2px solid #54C3E9; outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <img src="/images/symbol-dark.png" alt="IMMO Digital">
  <h1>Vous êtes hors ligne</h1>
  <p>Cette page n’a pas encore été consultée sur cet appareil. Vérifiez votre connexion, puis réessayez.</p>
  <p class="en" lang="en">You’re offline. Check your connection and try again.</p>
  <button type="button" onclick="location.reload()">Réessayer · Retry</button>
</main>
</body>
</html>
